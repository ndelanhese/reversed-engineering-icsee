name: Feature request
description: Describe a concrete camera-viewing need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, proposed behavior and any useful alternatives. English or Brazilian Portuguese accepted.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not include credentials, private footage or vendor artifacts. Proposals are not delivery commitments.
