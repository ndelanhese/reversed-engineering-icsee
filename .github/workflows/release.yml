name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download files from this run only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64-release
          path: release-assets
      - name: Create draft with assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/*.zip release-assets/*.tar.xz release-assets/ffmpeg-build.json release-assets/SHA256SUMS.txt --verify-tag --draft --title "Reversed engineering Icsee $RELEASE_TAG" --notes-file release-assets/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
